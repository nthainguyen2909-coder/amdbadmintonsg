<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMD Badminton Carnival 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Firebase (optional, only used if you fill in FIREBASE_CONFIG below) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#eceff4; --panel:#ffffff; --panel2:#f4f6fa; --line:#dce2ec;
    --txt:#1f2a37; --muted:#667085; --accent:#0f766e; --accent2:#15803d;
    --win:#e7f5ec; --gold:#8a6514; --qual:#eef8f1; --danger:#b42318;
    --focus:#e6f3f0; --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 6px rgba(16,24,40,.06);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv05","tnum"}
  h1,.catTitle,.sectionHd,.round .rhd,.lgTitle,.tab,.group h3,.tie .champ,.champBanner{font-family:'Plus Jakarta Sans','Inter',system-ui,sans-serif}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,#07241f 0%,#0f766e 58%,#14968c 100%);border-bottom:3px solid #06302a;box-shadow:0 3px 16px rgba(7,36,31,.28);padding:13px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;color:#fff}
  .amdLogo{display:inline-flex;align-items:center;gap:6px;background:#000;color:#fff;padding:8px 13px;border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.4);flex:none}
  .amdLogo .amdTxt{font-weight:900;font-size:22px;letter-spacing:-1px;font-family:'Arial Black','Plus Jakarta Sans',Arial,sans-serif;line-height:1}
  .amdArrow{height:19px;width:19px;fill:#fff;display:block}
  /* per-category accent theming (changes with the active tab) */
  body[data-cat="mens"]  header{background:linear-gradient(100deg,#07241f,#0f766e,#14968c)}
  body[data-cat="mixed"]{--accent:#b4530a}
  body[data-cat="mixed"] header{background:linear-gradient(100deg,#3a1d02,#b4530a,#d9892b)}
  body[data-cat="mixed"] .tab.active{color:#b4530a}
  body[data-cat="women"]{--accent:#be185d}
  body[data-cat="women"] header{background:linear-gradient(100deg,#3a0820,#be185d,#e0629a)}
  body[data-cat="women"] .tab.active{color:#be185d}
  body[data-cat="activities"]{--accent:#4338ca}
  body[data-cat="activities"] header{background:linear-gradient(100deg,#0e1030,#4338ca,#5b52e0)}
  body[data-cat="activities"] .tab.active{color:#4338ca}
  body[data-cat="attendance"]{--accent:#15803d}
  body[data-cat="attendance"] header{background:linear-gradient(100deg,#06260f,#15803d,#22a04e)}
  body[data-cat="attendance"] .tab.active{color:#15803d}
  .attBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}
  .attFbtn{padding:6px 12px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;font-weight:700;font-size:12.5px;cursor:pointer}
  .attFbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .attGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .attChip{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13.5px;font-weight:600;color:#223;cursor:pointer;text-align:left}
  .attChip:hover{border-color:var(--accent)}
  .attChip.on{background:#ecfdf3;border-color:#86e0a8;color:#14612f}
  .attBox{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:2px solid var(--line);border-radius:5px;font-size:13px;font-weight:800;color:#15803d;flex:0 0 auto}
  .attChip.on .attBox{border-color:#15803d;background:#d7f5e1}
  body[data-cat="courts"]{--accent:#0369a1}
  body[data-cat="courts"] header{background:linear-gradient(100deg,#07233a,#0369a1,#2b8fc9)}
  body[data-cat="courts"] .tab.active{color:#0369a1}
  .courtGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
  .courtCard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
  .courtHd{background:var(--panel2);font-weight:800;color:var(--accent);padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .crRow{padding:8px 12px;border-bottom:1px solid #eef1f3}
  .crRow:last-child{border-bottom:none}
  .crTop{display:flex;align-items:baseline;gap:8px}
  .crTime{font-weight:800;font-variant-numeric:tabular-nums;color:#0f172a;font-size:13px;min-width:42px}
  .crTag{font-weight:700;font-size:11.5px;color:var(--muted)}
  .crPair{font-size:13.5px;font-weight:600;margin-top:2px;color:#1f2a33}
  .crVs{color:var(--muted);font-weight:400;font-size:11px;margin:0 3px}
  .crOff{font-size:11.5px;color:var(--muted);margin-top:2px}
  .ctGridWrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);background:#fff}
  .ctTbl{border-collapse:collapse;font-size:11px}
  .ctTbl th{background:var(--panel2);color:var(--accent);font-weight:800;padding:6px 7px;border:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
  .ctTbl td{border:1px solid #eef1f3;padding:4px 6px;vertical-align:top;min-width:96px;max-width:140px}
  .ctTimeH{font-weight:800;color:#0f172a;background:#fafbfc !important;white-space:nowrap;position:sticky;left:0;z-index:1;text-align:center}
  .ctTbl th.ctTimeH{z-index:3;color:var(--accent)} .ctTbl td.ctTimeH{z-index:2}
  .ctCell.cat-md{background:#eaf1ff} .ctCell.cat-xd{background:#e9f8ee} .ctCell.cat-wd{background:#fdecf4}
  .ctCell.st-empty{background:#fbfefc}
  .ctFree{font-size:10px;font-style:italic;color:#8aa0ad;line-height:1.2;text-align:center}
  .ctCell.st-done{box-shadow:inset 4px 0 0 #1f9d55} .ctCell.st-live{box-shadow:inset 4px 0 0 #e08b00}
  .ctDot{display:inline-block;margin-right:3px;font-size:9px;vertical-align:middle} .ctDot.done{color:#1f9d55} .ctDot.live{color:#e08b00}
  .ctLegend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:6px;font-size:10.5px;align-items:center}
  .ctKey{padding:2px 8px;border-radius:999px;font-weight:800;color:#0f172a}
  .ctKey.cat-md{background:#cfe0ff} .ctKey.cat-xd{background:#cdeecf} .ctKey.cat-wd{background:#f6cfe1}
  .ctKeyDot{color:var(--muted);font-weight:700}
  .confBan{margin:8px 0;padding:9px 13px;border-radius:10px;font-size:12.5px;line-height:1.4}
  .confBan.ok{background:#eefaf0;border:1px solid #bfe6c8;color:#14612f}
  .confBan.bad{background:#fff0f0;border:1px solid #efb9b9;color:#8a1c1c}
  .confList{margin:6px 0 0;padding-left:18px} .confList li{margin:3px 0}
  .ctName{font-weight:800;font-size:10.5px;color:var(--accent);white-space:nowrap}
  .ctPair{font-size:10.5px;line-height:1.25;color:#1f2a33;margin-top:1px}
  .ctScore{font-weight:800;font-size:11px;margin-top:1px;color:#0f172a}
  .ctW{color:#14612f;font-weight:800}
  .actUpdate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
  .actUpdateHint{font-size:11.5px;color:var(--muted);max-width:420px}
  .crRow.st-done{border-left:3px solid #16a34a}
  .crRow.st-live{border-left:3px solid #e6a23c;background:#fffaf0}
  .crBadge{margin-left:auto;font-size:10px;font-weight:800;padding:1px 8px;border-radius:999px;white-space:nowrap}
  .crBadge.done{background:#e6f6ec;color:#15803d}
  .crBadge.live{background:#fdf1dd;color:#b4530a}
  .crScore{font-weight:800;color:#0f172a;font-variant-numeric:tabular-nums;margin-left:4px}
  .crWin{color:#14612f;font-weight:800}
  .stChip{display:inline-block;font-size:10.5px;font-weight:800;padding:0 7px;border-radius:999px;margin-left:4px;vertical-align:middle}
  .stChip.done{background:#e6f6ec;color:#15803d}
  .stChip.live{background:#fdf1dd;color:#b4530a}
  .seedBox{margin:8px 0 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:560px}
  .seedHd{background:var(--panel2);font-weight:800;color:var(--accent);padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}
  .seedTbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .seedTbl th{background:#fafbfc;color:var(--muted);font-weight:700;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line)}
  .seedTbl th:nth-child(3){text-align:left}
  .seedTbl td{padding:5px 8px;border-bottom:1px solid #f0f2f4;text-align:right;font-variant-numeric:tabular-nums}
  .seedTbl tr:last-child td{border-bottom:none}
  .seedTbl .sNo{font-weight:800;color:#0f172a;text-align:center;width:26px}
  .seedTbl .sName{text-align:left;font-weight:600;color:#1f2a33}
  .sBr{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;color:#fff}
  .sBr.b1{background:#0f766e}.sBr.b2{background:#b4530a}.sBr.b3{background:#be185d}.sBr.b4{background:#4338ca}
  .sBr.res{background:#cbd5e1;color:#475569;font-weight:700}
  .seedTbl tr.resv{color:#94a3b8}
  .seedTbl tr.resv .sName{color:#94a3b8;font-weight:500}
  .seedNote{padding:8px 12px;font-size:11.5px;line-height:1.5;color:var(--muted);border-top:1px solid var(--line);background:#fafbfc}
  /* activities view */
  .actSearch{margin:2px 0 16px}
  .actInput{width:100%;max-width:540px;padding:11px 15px;border:1px solid var(--line);border-radius:11px;font-size:15px;background:#fff;color:var(--txt);box-shadow:var(--shadow)}
  .actInput:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(67,56,202,.12)}
  .actDir{margin:0 0 16px}
  .actDirTitle{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:7px}
  .actChips{display:flex;flex-wrap:wrap;gap:6px;max-height:168px;overflow:auto;padding:2px}
  .actChip{padding:6px 12px;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer}
  .actChip:hover{border-color:var(--accent);color:var(--accent)}
  .actChip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .actPins{margin:0 0 14px;padding:10px 12px;background:#eef1ff;border:1px solid #d3daf2;border-radius:12px}
  .actChip.pin{background:#4338ca;color:#fff;border-color:#4338ca}
  .actChip.pin.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #4338ca}
  .actChip.pin .unpin{opacity:.85;margin-left:5px;font-size:11px;font-weight:800}
  .actChip.pin:hover{filter:brightness(1.1)}
  .actHdWrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pinBtn{padding:6px 13px;border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .pinBtn:hover{border-color:var(--accent)}
  .pinBtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .actCount{color:var(--muted);font-size:13px;margin-bottom:10px}
  .actRow{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  .actRow.clash{border-color:#e6a23c;background:#fff8ec}
  .actTime{min-width:82px;font-weight:800;font-size:15px;color:var(--accent);display:flex;flex-direction:column;line-height:1.2}
  .actCourt{font-weight:600;font-size:11px;color:var(--muted)}
  .actMid{flex:1;min-width:0}
  .actMatchup{font-weight:700;font-size:13.5px}
  .actMatchup .vs{color:var(--muted);font-weight:600;font-size:11px;margin:0 3px}
  .actStage{color:var(--muted);font-size:12px;margin-top:2px}
  .clashTag{color:#b4530a;font-weight:700;font-size:11px}
  .actRoles{display:flex;gap:5px;flex-wrap:wrap}
  .actRole{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .actRole.play{background:#eafaf2;color:#15803d;border:1px solid #a7e3c3}
  .actRole.ump{background:#eef2ff;color:#4338ca;border:1px solid #c3ccf5}
  .actRole.line{background:#fff4e6;color:#b4530a;border:1px solid #f0cfa0}
  header h1{font-size:21px;margin:0;font-weight:800;letter-spacing:.6px;color:#fff;line-height:1.12;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  header h1 .yr{color:#ffd24a}
  header .sub{color:#c9efe9;font-size:12px;letter-spacing:.2px;margin-top:3px}
  .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .tab{padding:7px 15px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#eafaf6;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px}
  .tab:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.22)}
  .tab.active{background:#fff;color:#0f766e;border-color:#fff}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{padding:7px 13px;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.warn{border-color:#f0cfca;color:var(--danger)}
  .btn.warn:hover{border-color:var(--danger)}
  main{padding:16px;max-width:1500px;margin:0 auto}
  .catTitle{font-size:19px;font-weight:800;margin:6px 0 2px;color:var(--accent);letter-spacing:-.3px}
  .catMeta{color:var(--muted);font-size:12.5px;margin-bottom:12px}
  .sectionHd{font-size:15px;font-weight:700;color:var(--txt);margin:26px 0 12px;border-bottom:2px solid var(--line);padding-bottom:8px}
  .koHd{display:flex;align-items:center;gap:10px}
  .fmtToggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .fmtRound{display:inline-flex;align-items:center;gap:3px;padding:3px 5px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
  .fmtRn{font-size:11px;color:var(--muted);font-weight:800;margin-right:2px;letter-spacing:.02em}
  .fmtRound .fmtBtn{padding:3px 8px;font-size:11px}
  .fmtLbl{font-size:12px;font-weight:600;color:var(--muted)}
  .fmtBtn{padding:5px 11px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;font-size:12px;font-weight:700;cursor:pointer}
  .fmtBtn:hover{border-color:var(--accent);color:var(--accent)}
  .fmtBtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .groupGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(430px,1fr));gap:14px}
  .group{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .group h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
  .group h3 .gx{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--accent2)}
  table{width:100%;border-collapse:collapse}
  .standings th,.standings td{padding:5px 6px;text-align:center;font-size:12.5px;border-bottom:1px solid var(--line)}
  .standings th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
  .standings td.name{text-align:left;font-weight:600}
  .standings tr.q{background:var(--qual)}
  .standings tr.q td.name::after{content:' ✓';color:var(--accent2)}
  .posbadge{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;background:var(--panel2);font-size:11px;margin-right:6px;color:var(--muted)}
  .q .posbadge{background:var(--accent2);color:#fff;font-weight:700}
  .pairIn{width:100%;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--txt);padding:3px 5px;font-size:12.5px;font-weight:600}
  .pairIn:focus{border-color:var(--accent);background:var(--panel2);outline:none}
  .matches{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
  .matchCard{border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-bottom:4px;background:var(--panel2);border-left:3px solid var(--line)}
  .matchGrid input.err,.tie .slot input.err{border-color:#e5484d !important;background:#fdecee !important;color:#c0272d}
  .setWarn{color:#c0272d;font-size:11.5px;font-weight:600;margin-top:5px;display:none;line-height:1.4}
  .matchMeta{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap}
  .matchMeta input{background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--txt);padding:3px 6px;font-size:11.5px}
  .matchMeta input.mName{flex:1;min-width:110px}
  .matchMeta input.mTime{width:110px}
  .matchMeta input.mCourt{width:110px}
  .matchHdr{display:flex;align-items:center;gap:8px;margin-bottom:3px;padding-bottom:3px;border-bottom:1px dashed var(--line)}
  .koHdr{padding:6px 8px;margin-bottom:0;background:var(--panel2)}
  .matchSum{flex:1;min-width:0;font-size:12px;color:var(--txt);line-height:1.5;overflow-wrap:anywhere}
  .matchSum .muted{color:var(--muted);font-style:italic}
  .matchSum .dot{color:var(--line);margin:0 1px}
  .detBtn{padding:4px 11px;font-size:11.5px;flex:none}
  body.vo .detBtn{display:none}
  .detBox{max-width:380px}
  .detField{display:block;margin-bottom:11px}
  .detField span{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .detField input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--txt)}
  .detField input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .matchOffic{display:flex;gap:6px;margin:0 0 6px;flex-wrap:wrap}
  .matchOffic .offIn{flex:1;min-width:90px;background:#f3f6ff;border:1px solid #d7deef;border-radius:5px;color:var(--txt);padding:3px 6px;font-size:11.5px}
  .koOffic{display:flex;gap:5px;padding:0 8px 6px;background:var(--panel2)}
  .koOffic .offIn{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--txt);padding:2px 5px;font-size:11px}
  .matchOffic .offIn::placeholder,.koOffic .offIn::placeholder{color:#8aa0c8}
  .koMeta{display:flex;gap:5px;padding:5px 8px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .koMeta input{background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--txt);padding:2px 5px;font-size:11px}
  .koMeta input.kName{flex:1;min-width:60px}
  .koMeta input.kTime{width:58px}
  .koMeta input.kCourt{width:60px}
  .matchRow{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12.5px;flex-wrap:wrap}
  .matchRow .mp{flex:1;min-width:90px;text-align:right}
  .matchRow .mp.b{text-align:left}
  .matchRow .mp.w{color:var(--accent2);font-weight:700}
  .setBox{display:flex;gap:5px}
  .setBox input{width:52px;height:40px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);padding:4px;font-size:19px;font-weight:700}
  .setBox input:focus{border-color:var(--accent);outline:none;background:var(--focus);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .vs{color:var(--muted);font-size:11px}
  .scoreCell{min-width:190px;display:flex;flex-direction:column;gap:3px;align-items:center}
  .setLabels{display:flex;gap:5px;font-size:10px;color:var(--muted)}
  .setLabels span{width:52px;text-align:center}
  .lots{font-size:10px;color:var(--gold);background:#fbf2d6;border:1px solid #ecd79c;border-radius:4px;padding:1px 5px;font-weight:600}
  .matchGrid{display:grid;gap:1px 6px;align-items:center;margin-top:1px;padding-left:2px}

function blankMatch(a,b){ return {a,b,name:"",time:"",court:"",umpire:"",line1:"",line2:"",sets:Array.from({length:GROUP_SETS},()=>[null,null])}; }
// force a sets array to exactly n games (keep existing scores, pad/trim)
function normSets(arr,n){ arr=(arr||[]).slice(0,n); while(arr.length<n) arr.push([null,null]); return arr; }

function freshCat(key){
  const cfg = CATS[key];
  const groups = [];
  for(let g=0; g<cfg.groups; g++){
    const n = DEFAULT_PAIRS_PER_GROUP[key];
    const pairs = Array.from({length:n},(_,i)=>({id:`${key}-${g}-${i}`, name:""}));
    groups.push({letter:GROUP_LETTERS[g], pairs, matches:[]});
    rebuildMatches(groups[g]);
  }
  return {groups, knockout:null};
}

function rebuildMatches(group){
  // round-robin among non-removed pairs; preserve existing scores/name/court by pair-id key
  const old = {};
  (group.matches||[]).forEach(m=>{ old[m.a+"|"+m.b]=m; old[m.b+"|"+m.a]=m; });
  const ids = group.pairs.map(p=>p.id);
  const order = spreadSchedule(ids);   // arranged so each pair gets rest between its matches
  const ms=[];
  order.forEach(([a,b])=>{
    const m = blankMatch(a,b);
    const prev = old[a+"|"+b];
    if(prev){ m.sets=normSets(prev.sets,GROUP_SETS); m.name=prev.name||""; m.time=prev.time||""; m.court=prev.court||""; m.umpire=prev.umpire||""; m.line1=prev.line1||""; m.line2=prev.line2||""; }
    ms.push(m);
  });
  group.matches = ms;
}

// Order the round-robin so no pair plays back-to-back where avoidable: greedily pick the
// next match whose two pairs have rested longest, and never repeat a pair from the previous match.
function spreadSchedule(ids){
  const matches=[];
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++) matches.push([ids[i],ids[j]]);
  if(matches.length<=1) return matches;
  const result=[], last={}, rest=matches.slice();
  while(rest.length){
    const prev = result.length ? result[result.length-1] : null;
    let best=0, bestScore=-Infinity;
    for(let i=0;i<rest.length;i++){
      const a=rest[i][0], b=rest[i][1];
      const sharesPrev = prev && (prev[0]===a||prev[1]===a||prev[0]===b||prev[1]===b);
      const ga = result.length - (last[a]===undefined?-10:last[a]);
      const gb = result.length - (last[b]===undefined?-10:last[b]);
      let score = Math.min(ga,gb)*10 + (ga+gb);
      if(sharesPrev) score -= 1000;   // strongly avoid a pair playing twice in a row
      if(score>bestScore){ bestScore=score; best=i; }
    }
    const m=rest.splice(best,1)[0];
    last[m[0]]=result.length; last[m[1]]=result.length;
    result.push(m);
  }
  return result;
}

function load(){
  let raw=null; try{ raw=localStorage.getItem(LS_KEY); }catch(e){}

// Round robin is a single game: trim any older 3-game group matches down to GROUP_SETS.
function migrateGroupSets(){

      else ko.third.sets=normSets(ko.third.sets,1);

// Standardize the same-person spelling variants wherever they appear in pair names,
// so each person shows once and search finds all their matches. Runs on every load.
const NAME_FIXES={
  "Tan, Girlene":"Girlene Tan", "Lee Han-Wee":"Lee Han Wee", "Lee Yu, Tan":"Tan Lee Yu",
  "Eunice Seng Yi Xuan":"Eunice Yi Xuan Seng", "Lim, Xin Wei":"Lim Xin Wei",

// idempotent: only expand when the target isn't already present (so it won't re-expand on each load)
function fixName(s){ s=s||""; for(const f in NAME_FIXES){ const to=NAME_FIXES[f]; if(s.indexOf(f)>=0 && s.indexOf(to)<0) s=s.split(f).join(to); } return s; }

/* ===================== SCORING / STANDINGS ===================== */
// A set is "played" if both scores are numbers and not equal.
function setWinner(set){
  const [x,y]=set;
  if(x===null||y===null||x===""||y==="") return null;
  const a=Number(x), b=Number(y);
  if(isNaN(a)||isNaN(b)||a===b) return null;
  return a>b?0:1; // index of winner within match (0=a,1=b)
}
// Returns {played, winner:0/1/null, setsWon:[a,b], ptsFor:[a,b]}
function matchResult(m){
  let wa=0,wb=0, pa=0,pb=0, playedSets=0;
  const need=Math.ceil(m.sets.length/2); // 1 game for round-robin, 2 for best-of-3 knockout
  for(let k=0;k<m.sets.length;k++){
    if(wa>=need||wb>=need) break;   // match already won — ignore any later (unplayed) set
    const w=setWinner(m.sets[k]);
    if(w!==null){
      playedSets++;
      pa+=Number(m.sets[k][0]); pb+=Number(m.sets[k][1]);
      if(w===0) wa++; else wb++;
    }
  }
  let winner=null, decided=false;
  if(wa>=need) {winner=0;decided=true;}
  else if(wb>=need){winner=1;decided=true;}
  return {playedAny:playedSets>0, decided, winner, setsWon:[wa,wb], ptsFor:[pa,pb]};
}
// Validate a completed set against badminton rules. Returns an error message, or null if OK.
//   win at 21 by >=2  |  deuce 20-20+ needs exactly a 2-point gap  |  hard cap 30 (30-29 allowed).
function setError(a,b){
  if(a===null||a===undefined||a===""||b===null||b===undefined||b==="") return null; // incomplete
  a=Number(a); b=Number(b);
  if(isNaN(a)||isNaN(b)) return null;
  if(a<0||b<0) return "scores can't be negative";
  if(a===b) return "a set can't end level ("+a+"–"+b+")";
  const hi=Math.max(a,b), lo=Math.min(a,b);
  if(hi>30) return "30 is the maximum point";
  if(hi<21) return "winner must reach 21";
  if(hi===30) return (lo===29||lo===28) ? null : "at 30 it must be 30–29 or 30–28";
  if(hi===21) return (lo<=19) ? null : "must win by 2 (e.g. 21–19, not "+hi+"–"+lo+")";
  return (hi-lo===2) ? null : "must win by 2 (e.g. "+lo+"–"+(lo+2)+", not "+hi+"–"+lo+")"; // 22..29
}
// Apply red highlight + reason to a match's invalid sets; updates the card's .setWarn note.
function markSetErrors(card, m){
  const inputs=card.querySelectorAll('.matchGrid input');
  const ns=m.sets.length;
  if(inputs.length<ns*2) return;
  const msgs=[];
  for(let s=0;s<ns;s++){
    const err=setError(m.sets[s][0], m.sets[s][1]);
    [inputs[s], inputs[s+ns]].forEach(x=>{ if(!x)return; x.classList.toggle('err', !!err); if(err)x.title="Invalid score: "+err; else if(x.title&&x.title.startsWith("Invalid"))x.title=""; });
    if(err) msgs.push((ns>1?("Game "+(s+1)+" — "):"")+err);
  }
  const warn=card.querySelector('.setWarn');
  if(warn){ warn.textContent = msgs.length?("⚠ "+msgs.join(" · ")):""; warn.style.display=msgs.length?"block":"none"; }
}
// True when the first two sets were both won by the same side (match already 2-0) —
// in best-of-3 the deciding 3rd set is then not played.
function decidedInTwo(sets){
  if(sets.length<3) return false;
  const w0=setWinner(sets[0]), w1=setWinner(sets[1]);
  return (w0!==null && w1!==null && w0===w1);
}

// Standings ranking priority (group stage) — official 6-step rule:
//   1) Matches WON
//   2) Game (set) differential: games won − games lost, across all matches
//   3) Point differential: points scored − conceded, across all games
//   4) Head-to-head: winner of the direct match ranks higher (among tied pairs only)
//   5) Total points scored across all matches
//   6) Drawing lots (manual) — app keeps a stable order; a genuine tie here must be
//      drawn by the organizing committee (flagged in the UI).
function standings(group){
  const rows = group.pairs.map(p=>({id:p.id,name:p.name||"—",wins:0,losses:0,played:0,setW:0,setL:0,pf:0,pa:0}));
  const idx={}; rows.forEach((r,i)=>idx[r.id]=i);
  group.matches.forEach(m=>{
    const r=matchResult(m);
    if(!r.decided) return;
    const A=idx[m.a], B=idx[m.b];
    rows[A].played++; rows[B].played++;
    rows[A].setW+=r.setsWon[0]; rows[A].setL+=r.setsWon[1];
    rows[B].setW+=r.setsWon[1]; rows[B].setL+=r.setsWon[0];
    rows[A].pf+=r.ptsFor[0]; rows[A].pa+=r.ptsFor[1];
    rows[B].pf+=r.ptsFor[1]; rows[B].pa+=r.ptsFor[0];
    if(r.winner===0){rows[A].wins++;rows[B].losses++;} else {rows[B].wins++;rows[A].losses++;}
  });
  rows.forEach(r=>{ r.gameDiff=r.setW-r.setL; r.diff=r.pf-r.pa; r.lots=false; });
  // Steps 1–3: matches won → game differential → point differential
  rows.sort((x,y)=> (y.wins-x.wins) || (y.gameDiff-x.gameDiff) || (y.diff-x.diff));
  // Resolve any pairs still equal on (wins, gameDiff, pointDiff) via steps 4–6
  let out=[]; let i=0;
  while(i<rows.length){
    let j=i;
    while(j<rows.length && rows[j].wins===rows[i].wins && rows[j].gameDiff===rows[i].gameDiff && rows[j].diff===rows[i].diff) j++;
    out = out.concat(resolveTie(rows.slice(i,j), group));
    i=j;
  }
  return out;
}

// Resolve pairs tied through step 3:
//   Step 4 head-to-head = MATCH wins among the tied pairs only (recomputed as the tie shrinks),
//   Step 5 total points scored,
//   Step 6 drawing lots (stable fallback; such rows are flagged .lots for the committee draw).
function resolveTie(block, group){
  if(block.length<=1) return block;
  const ids=new Set(block.map(r=>r.id));
  const h2h={}; block.forEach(r=>h2h[r.id]=0);   // head-to-head match wins among tied pairs
  group.matches.forEach(m=>{
    if(!ids.has(m.a)||!ids.has(m.b)) return;      // only matches between the tied pairs
    const r=matchResult(m); if(!r.decided) return;
    if(r.winner===0) h2h[m.a]++; else h2h[m.b]++;
  });
  block.forEach(r=>{ r._h2h=h2h[r.id]; });
  block.sort((a,b)=> b._h2h - a._h2h);
  let out=[]; let i=0;
  while(i<block.length){
    let j=i;
    while(j<block.length && block[j]._h2h===block[i]._h2h) j++;
    const sub=block.slice(i,j);
    if(sub.length===1){ out=out.concat(sub); }
    else if(sub.length===block.length){
      // head-to-head could not separate anyone (e.g. circular A>B>C>A) -> Step 5 total points,
      // then Step 6: the tied pairs draw lots among themselves (flagged ⚖). Stable fallback order.
      sub.sort((a,b)=> (b.pf-a.pf) || a.id.localeCompare(b.id));
      const expected = group.pairs.length - 1;
      const allComplete = sub.every(x=>x.played===expected && expected>0);
      if(allComplete){
        for(let k=0;k<sub.length;k++){
          const same=sub.filter(x=>x.pf===sub[k].pf);
          if(same.length>1) sub[k].lots=true;   // still exactly equal on points -> draw lots
        }
      }
      out=out.concat(sub);
    } else {
      out=out.concat(resolveTie(sub, group));     // smaller head-to-head group may separate them
    }
    i=j;
  }
  return out;
}

// Collect qualifiers in seed order. Returns array of {seed, groupLetter, pos, id, name, wins, pf}
function qualifiers(catKey){
  const cfg=CATS[catKey]; const cat=DB[catKey];
  const perG=cfg.qualifiersPerGroup;
  const byPos=[]; // byPos[pos] = list across groups
  cat.groups.forEach(g=>{
    const st=standings(g);
    for(let pos=0;pos<perG;pos++){
      const r=st[pos];
      byPos[pos]=byPos[pos]||[];
      byPos[pos].push({groupLetter:g.letter,pos,id:r?r.id:null,name:r?r.name:"",wins:r?r.wins:0,diff:r?r.diff:0,pf:r?r.pf:0});
    }
  });
  // Seed: all 1st-place first, then all 2nd-place, etc. Within a position,
  // order by wins, then point difference (head-to-head is undefined across groups).
  let seedList=[];
  byPos.forEach(list=>{
    list.sort((a,b)=>(b.wins-a.wins)||(b.diff-a.diff)||(b.pf-a.pf));
    seedList=seedList.concat(list);
  });
  seedList.forEach((s,i)=>s.seed=i+1);
  return seedList;
}
function labelFor(q){ const nm=(q&&q.name&&q.name.trim())?q.name:`?`; return `${nm}`; }
// Rank ALL qualifiers across groups by overall record: win% → game diff → point diff → points-for.
// Win% (not raw wins) keeps it fair across groups of different sizes. Used to seed the bracket.
// Per-match normalisation so a 3-pair group (2 games each) compares fairly with a 4-pair group (3 games).
function seedStat(r){ const p=r.played||1; return {id:r.id, name:r.name, played:r.played, wp:(r.played?r.wins/r.played:0),
  gpm:r.gameDiff/p, ppm:r.diff/p, ptpm:r.pf/p, gameDiff:r.gameDiff, diff:r.diff, pf:r.pf}; }
function seedCmp(a,b){ return (b.wp-a.wp) || (b.gpm-a.gpm) || (b.ppm-a.ppm) || (b.ptpm-a.ptpm); }
function overallSeeds(catKey){
  const cfg=CATS[catKey], cat=DB[catKey], perG=cfg.qualifiersPerGroup, all=[];
  cat.groups.forEach(g=>{ const st=standings(g);
    for(let pos=0;pos<perG;pos++){ const r=st[pos]; if(!r) continue; const s=seedStat(r); s.group=g.letter; all.push(s); }
  });
  all.sort(seedCmp);
  // the 4 branch anchors (seeds 1–4) must come from 4 DIFFERENT groups: take the best pair from
  // each of 4 distinct groups for the top 4, then the rest keep overall-record order.
  const top4=[], rest=[], usedG=new Set();
  all.forEach(s=>{ if(top4.length<4 && !usedG.has(s.group)){ top4.push(s); usedG.add(s.group); } else rest.push(s); });
  return top4.concat(rest);
}
// is this category's knockout drawn by overall-record SEEDING (S-refs) rather than fixed group refs?
function isSeededDraw(catKey){ const d=CUSTOM_DRAWS[catKey]; return !!(d && d[0] && /^S\d+$/.test(d[0].topRef||"")); }
// Rank EVERY pair in the category by overall record (all pairs, not just qualifiers).
function overallRankingAll(catKey){
  const cat=DB[catKey], all=[];
  cat.groups.forEach(g=>{ const st=standings(g); st.forEach(r=>all.push(seedStat(r))); });
  all.sort(seedCmp);
  return all;
}
// Order-of-merit table. For the seeded (MD/XD) draws: top 15 of ALL pairs, qualifiers tagged with
// their branch, the rest marked as reserves. For WD: just the 4 qualifiers.
function renderSeedTable(catKey){
  const branched=isSeededDraw(catKey);
  const box=document.createElement('div'); box.className="seedBox";
  const sg=x=>(x>=0?"+":"")+x.toFixed(1);
  const cell=s=>`<td>${(s.wp*100).toFixed(0)}%</td><td>${sg(s.gpm)}</td><td>${sg(s.ppm)}</td><td>${s.ptpm.toFixed(1)}</td>`;
  const headCols=`<th title="Matches won %">Win%</th><th title="Game differential per match">G±/g</th><th title="Point differential per match">Pt±/g</th><th title="Points scored per match">Pts/g</th>`;
  if(branched){
    const seeds=overallSeeds(catKey);                       // qualifiers, in seed order
    const seedBranch={}; seeds.forEach((s,i)=>seedBranch[s.id]=((i)%4)+1);
    const qSet=new Set(seeds.map(s=>s.id));
    const ranking=overallRankingAll(catKey), limit=Math.min(15, ranking.length);
    const rows=ranking.slice(0,limit).map((s,i)=>{ const isQ=qSet.has(s.id), br=seedBranch[s.id];
      return `<tr class="${isQ?"":"resv"}"><td class="sNo">${i+1}</td>`
        +`<td>${isQ?`<span class="sBr b${br}">B${br}</span>`:`<span class="sBr res">res</span>`}</td>`
        +`<td class="sName">${escapeHtml(s.name||"—")}</td>`+cell(s)+`</tr>`; }).join("");
    box.innerHTML=`<div class="seedHd">🏅 Order of merit — top ${limit} (${seeds.length} qualify · 4 branches)</div>
      <table class="seedTbl"><thead><tr><th>#</th><th>Br</th><th>Pair</th>${headCols}</tr></thead><tbody>${rows}</tbody></table>`
      +`<div class="seedNote">Ranked by overall record using <b>per-match averages</b>, so a 3-pair group (2 games each) is judged on the <b>same standard</b> as a 4-pair group (3 games). Each stat divides by <b>matches played (g)</b>:
        <br>• <b>Win%</b> = matches won ÷ played × 100
        <br>• <b>G±/g</b> = (games won − games lost) ÷ played
        <br>• <b>Pt±/g</b> = (points scored − points conceded) ÷ played
        <br>• <b>Pts/g</b> = points scored ÷ played
        <br>Order: Win% → G±/g → Pt±/g → Pts/g. <b>Example:</b> a 3-0 pair in a 4-team group (G±&nbsp;+3 over 3 games = +1.0/g) ties a 2-0 pair in a 3-team group (+2 over 2 = +1.0/g) — fair.
        <br>The <b>top 4 seeds (branch anchors) always come from 4 different groups</b> (best pair of each), then spread so seeds 1 and 2 can only meet in the Final.</div>`;
  } else {
    const seeds=overallSeeds(catKey), n=seeds.length;
    const rows=seeds.map((s,i)=>`<tr><td class="sNo">${i+1}</td><td class="sName">${escapeHtml(s.name||"—")}</td>`+cell(s)+`</tr>`).join("");
    box.innerHTML=`<div class="seedHd">🏅 Seeding order — by overall record (1–${n})</div>
      <table class="seedTbl"><thead><tr><th>#</th><th>Pair</th>${headCols}</tr></thead><tbody>${rows}</tbody></table>`;
  }
  return box;
}

/* ===================== KNOCKOUT ===================== */
// Standard seeding orders so top seeds meet latest.
const SEED_ORDER = {
  16:[1,16,9,8,5,12,13,4,3,14,11,6,7,10,15,2],
  8 :[1,8,5,4,3,6,7,2],
  4 :[1,4,3,2]
};
function roundNames(size){
  // size = number of slots in first knockout round
  if(size===16) return ["R16","QF","SF","F"];
  if(size===8)  return ["QF","SF","F"];
  if(size===4)  return ["SF","F"];
  return ["F"];
}
function firstRoundSize(catKey){
  const q = CATS[catKey].groups * CATS[catKey].qualifiersPerGroup;
  if(q<=4) return 4; if(q<=8) return 8; return 16;
}

// A first-round slot is stored as a GROUP REFERENCE string that resolves live from standings:
//   "A1" = winner of group A, "B2" = runner-up of group B, "C3" = 3rd of group C, "BYE", or "" (empty).
function qRefTeam(catKey, ref){
  if(!ref) return null;
  if(ref==="BYE") return {bye:true};
  // "S<n>" = the n-th overall seed (by record). n beyond the qualifier count = a bye.
  if(/^S\d+$/.test(ref)){
    const n=parseInt(ref.slice(1),10), seeds=overallSeeds(catKey);
    if(n>seeds.length) return {bye:true};
    const r=seeds[n-1]; const named=(r.name&&r.name.trim()&&r.name!=="—");
    return {id:r.id, name: named?r.name:("Seed "+n), ref:"#"+n};
  }
  const letter=ref[0], pos=parseInt(ref.slice(1),10)-1;
  const g=DB[catKey].groups.find(x=>x.letter===letter);
  if(!g) return {id:null,name:ref,ref};
  const st=standings(g), r=st[pos];
  if(!r) return {id:null,name:ref,ref};
  // show the group rank (e.g. "A2") until the pair actually has a name, then the name fills in
  const named=(r.name&&r.name.trim()&&r.name!=="—");
  return {id:r.id, name: named?r.name:ref, ref};
}
// Fixed custom draws for specific categories (exact matchups the committee wants).
// "BYE"/"BYE" ties mean the winner of the adjacent tie rests one round (byes into the next round).
// Four-branch seeded draw (seeds come from overall record across groups):
//   Branch 1 = seeds 1,5,9 ; Branch 2 = 2,6,10 ; Branch 3 = 3,7,11 ; Branch 4 = 4,8,12.
//   In each branch the two lower seeds play R16, the branch's top seed OVERCOMES (byes) into the QF.
//   (For XD only 10 seeds exist, so S11/S12 resolve to byes -> branches 3 & 4 go straight to QF.)
//   R16 ties are arranged so the app's fixed propagation yields: QF0=B1, QF1=B4, QF2=B2, QF3=B3,
//   SF0 = B1 v B4 (left), SF1 = B2 v B3 (right) -> seeds 1 and 2 can only meet in the Final.
const BRANCH16 = [
  {topRef:"S1", botRef:"BYE"},   // Branch 1 top -> QF0 top
  {topRef:"S5", botRef:"S9"},    // Branch 1 R16  -> QF0 bot
  {topRef:"S4", botRef:"BYE"},   // Branch 4 top -> QF1 top
  {topRef:"S8", botRef:"S12"},   // Branch 4 R16  -> QF1 bot
  {topRef:"S2", botRef:"BYE"},   // Branch 2 top -> QF2 top
  {topRef:"S6", botRef:"S10"},   // Branch 2 R16  -> QF2 bot
  {topRef:"S3", botRef:"BYE"},   // Branch 3 top -> QF3 top
  {topRef:"S7", botRef:"S11"}    // Branch 3 R16  -> QF3 bot
];
const CUSTOM_DRAWS = {
  mixed: BRANCH16.map(d=>({topRef:d.topRef,botRef:d.botRef})),
  mens:  BRANCH16.map(d=>({topRef:d.topRef,botRef:d.botRef}))
};
// Default draw. Uses a CUSTOM_DRAW if defined for this category; otherwise the rotation:
//   runner-up of each group vs winner of the NEXT group (A2 vs B1, B2 vs C1, ... wraps around).
function defaultDraw(catKey){
  if(CUSTOM_DRAWS[catKey]) return CUSTOM_DRAWS[catKey].map(d=>({topRef:d.topRef,botRef:d.botRef}));
  const cfg=CATS[catKey], G=cfg.groups, nTies=firstRoundSize(catKey)/2;
  const draw=[];
  for(let i=0;i<nTies;i++){
    if(i<G){ draw.push({topRef:GROUP_LETTERS[i]+"2", botRef:GROUP_LETTERS[(i+1)%G]+"1"}); }
    else   { draw.push({topRef:"", botRef:""}); }
  }
  return draw;
}
// Resolve the stored draw refs into the actual teams in round 1 (keeps scores/name/court).
function fillFirstRound(catKey){
  const ko=DB[catKey].knockout; if(!ko||!ko.draw) return;
  ko.draw.forEach((d,i)=>{ const t=ko.rounds[0][i]; if(!t)return; t.top=qRefTeam(catKey,d.topRef); t.bot=qRefTeam(catKey,d.botRef); });
}
// Knockout format is now PER ROUND (R16 / QF / SF / F), each 1 game or best-of-3.
// Stored in DB[cat].koRoundSets = {R16:1|3, QF:1|3, ...}.
function koRoundSetsMap(catKey){
  const cat=DB[catKey];
  if(!cat.koRoundSets){
    cat.koRoundSets={};
    const rns = cat.knockout ? cat.knockout.rnames : roundNames(firstRoundSize(catKey));
    const legacy=cat.koSets; const def=(legacy===1||legacy===3)?legacy:3;   // migrate old single value
    rns.forEach(r=>cat.koRoundSets[r]=def);
  }
  return cat.koRoundSets;
}
function koSetsFor(catKey, rname){
  const map=DB[catKey].koRoundSets;
  let n = map && map[rname];
  if(n===undefined){ const legacy=DB[catKey].koSets; n=(legacy===1||legacy===3)?legacy:3; }
  return (n===1||n===3)?n:3;
}
function buildKnockout(catKey, reseed){
  const cat=DB[catKey];
  const size=firstRoundSize(catKey), nTies=size/2, rnames=roundNames(size);
  koRoundSetsMap(catKey);
  if(!cat.knockout || reseed){
    const rounds=[];
    let n=nTies;
    rounds.push(Array.from({length:n},()=>({top:null,bot:null,name:"",court:"",sets:Array.from({length:koSetsFor(catKey,rnames[0])},()=>[null,null])})));
    for(let r=1;r<rnames.length;r++){ n=Math.ceil(n/2); rounds.push(Array.from({length:n},()=>({top:null,bot:null,name:"",court:"",sets:Array.from({length:koSetsFor(catKey,rnames[r])},()=>[null,null])}))); }
    cat.knockout={size,rounds,rnames,draw:defaultDraw(catKey)};
  }
  if(!cat.knockout.draw) cat.knockout.draw=defaultDraw(catKey);   // migrate older saves
  // keep every tie's games count in sync with its round's chosen format (preserves scores)
  cat.knockout.rounds.forEach((rd,ri)=>rd.forEach(t=>{ t.sets=normSets(t.sets, koSetsFor(catKey, cat.knockout.rnames[ri])); }));
  // 3rd/4th place playoff (losers of the two semifinals) — single game
  if(cat.knockout.rnames.includes("SF")){
    if(!cat.knockout.third) cat.knockout.third={top:null,bot:null,name:"",court:"",time:"",sets:[[null,null]]};
    else cat.knockout.third.sets=normSets(cat.knockout.third.sets,1);
  }
  fillFirstRound(catKey);
  propagate(catKey);
}
// Switch the format for ONE knockout round (1 game vs best-of-3) without losing the draw.
function setKoRoundFormat(catKey, rname, n){
  koRoundSetsMap(catKey)[rname]=n;
  const ko=DB[catKey].knockout;
  if(ko){ ko.rounds.forEach((rd,ri)=>{ if(ko.rnames[ri]===rname) rd.forEach(t=>{ t.sets=normSets(t.sets,n); }); }); }
  save(); render();
}
// Button handler: (re)build the bracket from current standings, save, and refresh the screen.
function reseedKnockout(){
  if(DB[currentCat].knockout && !confirm("Re-seed the knockout? This resets the bracket draw for "+CATS[currentCat].name+" (scores already entered in the bracket will be cleared).")) return;
  buildKnockout(currentCat, true);
  save();
  render();
  flash("Knockout seeded");
}
// Refresh EVERY category's knockout from the current group standings, without clearing any
// knockout scores already entered. Eliminated pairs drop off; current qualifiers fill in.
// Used by the "Update tasks from results" button on the Activities tab.
function updateActivitiesFromResults(){
  refreshAllKnockouts();
  save();
  render();
  flash("Tasks updated from results");
}
// Re-derive EVERY category's knockout from current standings (names/seeds only) + propagate winners,
// WITHOUT clearing scores and WITHOUT saving/rendering. Called at the top of the Activities and Courts
// tabs so a person's knockout matches are always live-current the moment you look — no button needed.
// Seeded draws (MD/XD) refill from the live order of merit; manual first-round picks are preserved.
function catHasGroupResults(k){
  return (DB[k].groups||[]).some(g=>(g.matches||[]).some(m=>m.sets&&m.sets.some(s=>s&&(s[0]!=null||s[1]!=null))));
}
function refreshAllKnockouts(){
  // Only auto-seed a category's knockout once its group stage has real results — seeding from all-tied
  // (empty) standings produces a degenerate bracket with duplicate pairs / false clashes.
  for(const k in CATS){ if(DB[k] && DB[k].knockout && catHasGroupResults(k)){ buildKnockout(k, false); propagate(k); } }
}
// One-time manual re-base: slide only the UPCOMING (unplayed) matches so the next one starts at the
// current clock time. Matches that already have a score keep their recorded times (history preserved).
// Not a live sync — click again later if the event falls further behind.
function syncScheduleToNow(){
  const fmt=x=>{ x=((Math.round(x)%1440)+1440)%1440; return Math.floor(x/60)+":"+String(x%60).padStart(2,'0'); };
  const played=o=> o && o.sets && o.sets.some(s=>s&&(s[0]!=null||s[1]!=null));
  const items=[];
  for(const k in CATS){ (DB[k].groups||[]).forEach(g=>(g.matches||[]).forEach(m=>items.push(m)));
    const ko=DB[k].knockout; if(ko){ ko.rounds.forEach(r=>r.forEach(t=>items.push(t))); if(ko.third) items.push(ko.third); } }
  let anchor=Infinity;
  items.forEach(o=>{ if(o.time && !played(o)){ const m=parseTime(o.time); if(m!=null&&m<anchor) anchor=m; } });
  if(!isFinite(anchor)){ alert("No upcoming matches to sync — every scheduled match already has a score."); return; }
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes(), off=nowMin-anchor;
  if(off===0){ flash("Next match already starts now ("+fmt(nowMin)+")"); return; }
  if(!confirm("Slide all UPCOMING (unplayed) matches by "+(off>=0?"+":"")+off+" min so the next one starts now ("+fmt(nowMin)+")?\n\nAlready-played matches keep their recorded times. (Tip: export a backup first.)")) return;
  items.forEach(o=>{ if(o.time && !played(o)){ const m=parseTime(o.time); if(m!=null) o.time=fmt(m+off); } });
  save(); render(); flash("Upcoming matches synced — next now "+fmt(nowMin));
}
// <select> options for a first-round slot: empty, BYE, then every qualifier (A1, A2, ... by group).
function drawOptions(catKey, current){
  const cfg=CATS[catKey];
  let html=`<option value=""${!current?" selected":""}>— pick —</option><option value="BYE"${current==="BYE"?" selected":""}>Overcome</option>`;
  for(let gi=0; gi<cfg.groups; gi++){
    const letter=GROUP_LETTERS[gi], g=DB[catKey].groups[gi], st=standings(g);
    for(let pos=0;pos<cfg.qualifiersPerGroup;pos++){
      const ref=letter+(pos+1), r=st[pos];
      const nm=(r&&r.name&&r.name.trim())?r.name:"(tbd)";
      html+=`<option value="${ref}"${current===ref?" selected":""}>${letter}${pos+1} · ${escapeHtml(nm)}</option>`;
    }
  }
  return html;
}

function tieWinner(tie){
  if(tie.top&&tie.top.bye&&tie.bot&&tie.bot.bye) return null;
  if(tie.top&&tie.top.bye) return tie.bot;
  if(tie.bot&&tie.bot.bye) return tie.top;
  if(!tie.top||!tie.bot||tie.top.name===undefined||tie.bot.name===undefined) {
    // if one side empty, no auto winner
  }
  if(!tie.top||!tie.bot) return null;
  if(tie.top.bye) return tie.bot; if(tie.bot.bye) return tie.top;
  // need played scores
  const m={sets:tie.sets};
  const r=matchResult(m);
  if(!r.decided) return null;
  return r.winner===0?tie.top:tie.bot;
}

// loser of a decided tie (the side that is NOT the winner) -> feeds the 3rd-place match
function tieLoser(tie){
  if(!bothReal(tie)) return null;
  const w=tieWinner(tie); if(!w) return null;
  const topWon = tie.top.id===w.id && tie.top.name===w.name;
  return topWon ? tie.bot : tie.top;
}
function propagate(catKey){
  const ko=DB[catKey].knockout; if(!ko) return;
  for(let r=0;r<ko.rounds.length-1;r++){
    ko.rounds[r].forEach((tie,i)=>{
      const w=tieWinner(tie);
      const next=ko.rounds[r+1][Math.floor(i/2)];
      const slot = (i%2===0)?"top":"bot";
      if(w){ next[slot]={id:w.id,name:w.name,ref:w.ref}; }
      else if(tie.top&&tie.top.bye&&tie.bot&&tie.bot.bye){ next[slot]={bye:true}; } // all-bye tie -> carry a bye so the opponent advances next round
      else { next[slot]=null; }
    });
  }
  // 3rd/4th place playoff: filled by the two semifinal losers
  if(ko.third){
    const sfIdx=ko.rnames.indexOf("SF");
    if(sfIdx>=0 && ko.rounds[sfIdx] && ko.rounds[sfIdx].length>=2){
      const la=tieLoser(ko.rounds[sfIdx][0]), lb=tieLoser(ko.rounds[sfIdx][1]);
      ko.third.top = la?{id:la.id,name:la.name,ref:la.ref}:null;
      ko.third.bot = lb?{id:lb.id,name:lb.name,ref:lb.ref}:null;
    }
  }
}

      <span><b>L</b> = matches lost</span>
      <span><b>Games</b> = games (sets) won–lost</span>
      <span><b>G±</b> = game differential (games won − games lost)</span>
      <span><b>Pt±</b> = point differential (points scored − points conceded)</span>
      <span><b>Pts+</b> = total points scored</span>
    </div>

      <code>2</code> game differential (G±) →
      <code>3</code> point differential (Pt±) →
      <code>4</code> head-to-head (winner of the direct match) →
      <code>5</code> total points scored (Pts+) →
      <code>6</code> drawing lots by the tied pairs themselves <span style="color:var(--gold)">⚖</span>.
      Top ${CATS[currentCat].qualifiersPerGroup} of each group advance (shown with ✓).
      <br><span style="color:var(--muted)">If head-to-head forms a loop (e.g. <b>A beats B, B beats C, C beats A</b>), it can't separate the tied pairs — ranking continues to step 5 (total points), and if they're still exactly equal the tied pairs <b>draw lots among themselves</b> (flagged <span style="color:var(--gold)">⚖</span>).</span>
    </div>`;
  v.appendChild(legend);

         `<button class="fmtBtn${ks===3?" on":""}" data-r="${r}" data-n="3">Best of 3</button></span>`;
    });

    fmt.querySelectorAll('.fmtBtn').forEach(b=>{ b.onclick=()=>{ const n=+b.getAttribute('data-n'), r=b.getAttribute('data-r'); if(n!==koSetsFor(currentCat,r)) setKoRoundFormat(currentCat,r,n); }; });

  function catClass(cn){ cn=cn||""; if(/Women/.test(cn))return"wd"; if(/Mixed/.test(cn))return"xd"; if(/Men/.test(cn))return"md"; return""; }
  function cellInfo(e){
    if(!e) return {cls:"empty",cat:"",html:""};

    if(e.pairA&&e.pairB&&e.sets){ const r=matchResult({sets:e.sets});
      if(r.decided){cls="done";winner=r.winner;}

    const score=(e.sets||[]).filter(s=>s&&s[0]!=null&&s[1]!=null).map(s=>s[0]+"–"+s[1]).join(", ");

    +courts.map(c=>{ const cell=cellAt[t+"|"+c];

        const ci=cellInfo(cell); return `<td class="ctCell cat-${ci.cat} st-${ci.cls}">${ci.html}</td>`; }).join("")
    +`</tr>`; }).join("");

/* ===================== ACTIVITIES (combined schedule) ===================== */
// turn a free-text time like "9:30", "9:30am", "14:00" into minutes for sorting
function parseTime(t){
  if(!t) return 1e9;
  t=String(t);
  const m=t.match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
  if(m){ let hh=+m[1],mm=+m[2]; if(/p/i.test(t)&&hh<12)hh+=12; if(/a/i.test(t)&&hh===12)hh=0; return hh*60+mm; }
  const n=t.match(/\d{1,2}/); return n?(+n[0])*60:1e9;
}
// flatten every match (group + knockout) across all categories into one schedule list
function collectSchedule(){
  const out=[];
  for(const k in CATS){
    const cat=DB[k]; if(!cat) continue;
    (cat.groups||[]).forEach(g=>{
      const nm=id=>{const p=(g.pairs||[]).find(x=>x.id===id);return p?(p.name||""):"";};
      (g.matches||[]).forEach(m=>{
        out.push({catName:CATS[k].name, stage:"Group "+g.letter, name:m.name||"", time:m.time||"", court:m.court||"",
          pairA:nm(m.a), pairB:nm(m.b), umpire:m.umpire||"", line1:m.line1||"", line2:m.line2||"", sets:m.sets, t:parseTime(m.time)});
      });
    });
    if(cat.knockout){
      cat.knockout.rounds.forEach((round,ri)=>{
        round.forEach(tie=>{
          // a slot still showing its group-rank placeholder (e.g. "A1") isn't a real pair yet
          const rn=s=>isRef(s)?"":s;
          const pa=(tie.top&&!tie.top.bye)?rn(tie.top.name||""):"", pb=(tie.bot&&!tie.bot.bye)?rn(tie.bot.name||""):"";
          if(!pa&&!pb&&!tie.umpire&&!tie.line1&&!tie.line2) return;
          out.push({catName:CATS[k].name, stage:fullRoundName(cat.knockout.rnames[ri]), name:tie.name||"", time:tie.time||"", court:tie.court||"",
            pairA:pa, pairB:pb, umpire:tie.umpire||"", line1:tie.line1||"", line2:tie.line2||"", sets:tie.sets, t:parseTime(tie.time)});
        });
      });
    }
  }
  return out;
}
// LIVE conflict scan: as results fill the bracket, flag anyone (player OR official)
// booked in two matches in the same time slot. Only resolved names count (placeholders/byes ignored).
function scheduleConflicts(){
  const byTime={};
  collectSchedule().forEach(e=>{
    if(!e.time) return;
    const ppl=new Set([...splitPair(e.pairA),...splitPair(e.pairB),e.umpire,e.line1,e.line2]
      .map(s=>(s||'').replace(/\s+/g,' ').trim()).filter(s=>s&&!isRef(s)));
    (byTime[e.time]=byTime[e.time]||[]).push({label:(e.name||e.catName||"match")+" @"+(e.court||"?"), ppl:[...ppl]});
  });
  const conflicts=[];
  Object.keys(byTime).forEach(t=>{
    const seen={};
    byTime[t].forEach(m=>m.ppl.forEach(p=>{ const k=p.toLowerCase(); seen[k]=seen[k]||{name:p,labels:[]}; if(!seen[k].labels.includes(m.label)) seen[k].labels.push(m.label); }));
    Object.values(seen).forEach(o=>{ if(o.labels.length>1) conflicts.push({time:t,name:o.name,matches:o.labels}); });
  });
  return conflicts.sort((a,b)=>parseTime(a.time)-parseTime(b.time));
}
// live status chip for a schedule entry (done + score / playing), from the filled-in result
function statusChip(e){
  if(!e||!e.pairA||!e.pairB||!e.sets) return "";
  const r=matchResult({sets:e.sets});
  if(r.decided){
    const score=e.sets.filter(s=>s&&s[0]!=null&&s[1]!=null).map(s=>s[0]+"–"+s[1]).join(", ");
    return ` <span class="stChip done">✓ Done${score?" "+escapeHtml(score):""}</span>`;
  }
  if(r.playedAny || e.sets.some(s=>s&&(s[0]!=null||s[1]!=null))) return ` <span class="stChip live">● Playing</span>`;
  return "";
}
// split a pair name ("Alex / Ben" or "Alex - Ben") into individual people
// a knockout group-rank placeholder like "A1", "B2", "F12" — not a real person
function isRef(s){ return /^[A-H][0-9]{1,2}$/.test((s||"").trim()); }
function splitPair(name){ return (name||"").split(/\s*\/\s*|\s+-\s+/).map(s=>s.trim()).filter(Boolean); }
// every unique individual across all pairs + officials (whitespace/case de-duplicated, sorted A→Z)
function collectPeople(){
  const map=new Map();   // lowercase key -> first-seen display name
  const add=n=>{ n=(n||"").replace(/\s+/g,' ').trim(); if(n && !isRef(n)){ const key=n.toLowerCase(); if(!map.has(key)) map.set(key,n); } };
  collectSchedule().forEach(e=>{
    splitPair(e.pairA).forEach(add);
    splitPair(e.pairB).forEach(add);
    [e.umpire,e.line1,e.line2].forEach(add);
  });
  return [...map.values()].sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'}));
}

function togglePin(n){ n=(n||"").trim(); if(!n)return; let a=getPins(); if(isPinned(n)) a=a.filter(x=>x.toLowerCase()!==n.toLowerCase()); else a.push(n); setPins(a); }

// Combined schedule for every pinned person (group + knockout), sorted by time, with clash flags

function detailsSummary(o){
  const parts=[];

  document.body.appendChild(ov);
  ov.querySelectorAll('input[data-k]').forEach(inp=>{ inp.oninput=()=>{ obj[inp.getAttribute('data-k')]=inp.value; save(true); }; });
  const close=()=>{ ov.remove(); render(); };
  ov.querySelector('.detDone').onclick=close;
  ov.onclick=(e)=>{ if(e.target===ov) close(); };
  const f=ov.querySelector('input'); if(f) f.focus();
}
function renderGroup(g,gi){
  const el=document.createElement('div'); el.className="group";
  const st=standings(g);
  const perG=CATS[currentCat].qualifiersPerGroup;
  const qSet=new Set(st.slice(0,perG).map(r=>r.id));

  // header + pair name editors
  let html=`<h3><span class="gx">Group ${g.letter}</span> <span class="note" style="margin:0">${g.pairs.length} pairs</span></h3>`;
  html+=`<table class="standings"><thead><tr><th style="text-align:left">#</th><th style="text-align:left">Pair</th><th title="Matches won">W</th><th>L</th><th title="Games won-lost">Games</th><th title="Game differential (won − lost)">G±</th><th title="Point differential (scored − conceded)">Pt±</th><th title="Total points scored">Pts+</th></tr></thead><tbody>`;
  st.forEach((r,i)=>{
    const q=qSet.has(r.id);
    const d=(r.diff>0?"+":"")+r.diff, gd=(r.gameDiff>0?"+":"")+r.gameDiff;
    html+=`<tr class="${q?'q':''}"><td><span class="posbadge">${i+1}</span></td>
      <td class="name" data-id="${r.id}">${escapeHtml(r.name)}${r.lots?' <span class="lots" title="Tie unresolved by all criteria — the tied pairs draw lots among themselves">⚖ draw</span>':''}</td>
      <td><b>${r.wins}</b></td><td>${r.losses}</td>
      <td>${r.setW}-${r.setL}</td><td>${gd}</td><td>${d}</td><td>${r.pf}</td></tr>`;
  });
  html+=`</tbody></table>`;
  el.innerHTML=html;

  // editable pair names (separate, so typing never fights standings sort)
  const editWrap=document.createElement('div');
  editWrap.className="pairEditor";
  editWrap.style.margin="8px 0";
  editWrap.innerHTML=`<div class="note" style="margin:2px 0">Pair names:</div>`;
  g.pairs.forEach((p,pi)=>{
    const row=document.createElement('div'); row.style.display="flex"; row.style.gap="6px"; row.style.alignItems="center"; row.style.marginBottom="3px";
    const idxSpan=document.createElement('span'); idxSpan.className="seedtag"; idxSpan.textContent=pi+1;
    const inp=document.createElement('input'); inp.className="pairIn"; inp.placeholder=`Pair ${pi+1} name`; inp.value=p.name;
    inp.oninput=()=>{p.name=inp.value; save(true); refreshStandingsOnly(); refreshKnockoutNames();};
    const del=document.createElement('button'); del.className="btn warn"; del.style.padding="2px 7px"; del.textContent="✕"; del.title="Remove pair";
    del.onclick=()=>{ if(g.pairs.length<=2){alert("A group needs at least 2 pairs.");return;} g.pairs.splice(pi,1); rebuildMatches(g); save(); render(); };
    row.append(idxSpan,inp,del);
    editWrap.appendChild(row);
  });
  const add=document.createElement('button'); add.className="btn"; add.style.marginTop="4px"; add.textContent="+ Add pair";
  add.onclick=()=>{ const nid=`${currentCat}-${gi}-${Date.now()}`; g.pairs.push({id:nid,name:""}); rebuildMatches(g); save(); render(); };
  editWrap.appendChild(add);
  el.appendChild(editWrap);

  // matches
  const mWrap=document.createElement('div'); mWrap.className="matches";
  const nameOf=id=>{const p=g.pairs.find(x=>x.id===id);return p?(p.name||"—"):"—";};
  g.matches.forEach((m,mi)=>{
    const r=matchResult(m);
    const card=document.createElement('div'); card.className="matchCard";
    // match details: compact summary + popup editor (titled fields)
    card.appendChild(detailsHeader(m, "Match details"));
    const aw=r.decided&&r.winner===0, bw=r.decided&&r.winner===1;
    // scoreboard-style grid: col 1 = pair names (stacked), then one column per game
    const ns=m.sets.length;   // round-robin = 1 game; (knockout handled elsewhere)
    const grid=document.createElement('div'); grid.className="matchGrid";
    grid.style.gridTemplateColumns=`minmax(84px,1fr) repeat(${ns}, 40px)`;
    grid.appendChild(document.createElement('div')); // empty corner above names
    for(let s=0;s<ns;s++){ const lb=document.createElement('div'); lb.className="mgLabel"; lb.textContent=ns>1?("S"+(s+1)):"Score"; grid.appendChild(lb); }
    const inpTop=[], inpBot=[];
    const nA=document.createElement('div'); nA.className="mgName"+(aw?" w":""); nA.innerHTML=pairNameHTML(nameOf(m.a)); nA.style.fontSize=nameFontSize(nameOf(m.a),13.5)+"px"; grid.appendChild(nA);
    for(let s=0;s<ns;s++){ const i=mkScore(m,mi,s,0); inpTop.push(i); grid.appendChild(i); }
    const nB=document.createElement('div'); nB.className="mgName"+(bw?" w":""); nB.innerHTML=pairNameHTML(nameOf(m.b)); nB.style.fontSize=nameFontSize(nameOf(m.b),13.5)+"px"; grid.appendChild(nB);
    for(let s=0;s<ns;s++){ const i=mkScore(m,mi,s,1); inpBot.push(i); grid.appendChild(i); }
    for(let s=0;s<ns;s++){ wireAutofill21(m,s,inpTop[s],inpBot[s]); }
    // 2-0 already? lock the (unused) deciding game (only applies to best-of-3)
    if(ns>=3 && decidedInTwo(m.sets)){
      if(m.sets[ns-1][0]!==null||m.sets[ns-1][1]!==null) m.sets[ns-1]=[null,null];
      inpTop[ns-1].disabled=true; inpTop[ns-1].value="";
      inpBot[ns-1].disabled=true; inpBot[ns-1].value="";
    }
    card.appendChild(grid);
    const warn=document.createElement('div'); warn.className="setWarn"; card.appendChild(warn);
    markSetErrors(card, m);
    mWrap.appendChild(card);
  });
  el.appendChild(mWrap);
  return el;
}

function mkScore(m,mi,s,side){
  const inp=document.createElement('input');
  inp.type="number"; inp.min="0"; inp.max="30"; inp.inputMode="numeric";
  const v=m.sets[s][side]; inp.value=(v===null||v===undefined)?"":v;
  inp.oninput=()=>{
    let val=inp.value===""?null:parseInt(inp.value,10);
    if(val!==null && !isNaN(val)){ if(val>30){val=30;inp.value=30;} if(val<0){val=0;inp.value=0;} }  // badminton game caps at 30
    m.sets[s][side]=(val===null||isNaN(val))?null:val;
    save(true);
    refreshStandingsOnly();
    refreshKnockoutNames();
  };
  return inp;
}

// When one side's score is entered as <=19, the game ended at 21 — auto-fill the
// opponent cell with 21 (only if empty; still editable, e.g. for deuce games 20+).
function wireAutofill21(m, s, topInp, botInp){
  const make=(selfIdx)=>()=>{
    const self=m.sets[s][selfIdx];
    const oppIdx=selfIdx===0?1:0;
    const opp=m.sets[s][oppIdx];
    if(self!==null && self!=="" && self>=0 && self<=19 && (opp===null||opp===undefined||opp==="")){
      m.sets[s][oppIdx]=21;
      (oppIdx===0?topInp:botInp).value=21;
      save(true); refreshStandingsOnly(); refreshKnockoutNames();
    }
  };
  topInp.addEventListener('change', make(0));
  botInp.addEventListener('change', make(1));
}

// Lightweight refresh that doesn't blow away focus: re-render standings tables + bracket seeds
function refreshStandingsOnly(){
  // Rebuild just the groups grid + bracket without touching the inputs the user is typing in
  // Simplest robust approach: debounce a full re-render of standings numbers.
  clearTimeout(window.__srTimer);
  window.__srTimer=setTimeout(()=>{ updateStandingsTables(); },150);
}
function updateStandingsTables(){
  const cat=DB[currentCat];
  const groups=document.querySelectorAll('.group');
  cat.groups.forEach((g,gi)=>{
    const st=standings(g);
    const perG=CATS[currentCat].qualifiersPerGroup;
    const qSet=new Set(st.slice(0,perG).map(r=>r.id));
    const tbody=groups[gi]?groups[gi].querySelector('.standings tbody'):null;
    if(!tbody)return;
    tbody.innerHTML=st.map((r,i)=>`<tr class="${qSet.has(r.id)?'q':''}">
      <td><span class="posbadge">${i+1}</span></td>
      <td class="name">${escapeHtml(r.name)}${r.lots?' <span class="lots" title="Tie unresolved by all criteria — the tied pairs draw lots among themselves">⚖ draw</span>':''}</td>
      <td><b>${r.wins}</b></td><td>${r.losses}</td>
      <td>${r.setW}-${r.setL}</td><td>${(r.gameDiff>0?"+":"")+r.gameDiff}</td><td>${(r.diff>0?"+":"")+r.diff}</td><td>${r.pf}</td></tr>`).join("");
    // update winner highlight on match rows
  });
  // also recompute match winner highlight
  cat.groups.forEach((g,gi)=>{
    const grids=groups[gi]?groups[gi].querySelectorAll('.matchGrid'):[];
    const nm=id=>{const p=g.pairs.find(x=>x.id===id);return p?(p.name||"—"):"—";};
    g.matches.forEach((m,mi)=>{
      const r=matchResult(m); const grid=grids[mi]; if(!grid)return;
      const names=grid.querySelectorAll('.mgName');
      // live-fill the pair names into each match as they're typed in the group
      if(names[0]){ setNameKeepBadge(names[0], nm(m.a)); names[0].classList.toggle('w', r.decided&&r.winner===0); }
      if(names[1]){ setNameKeepBadge(names[1], nm(m.b)); names[1].classList.toggle('w', r.decided&&r.winner===1); }
      // live-lock the deciding set once the match is 2-0
      const inputs=grid.querySelectorAll('input');
      if(inputs.length>=6){
        const dec=decidedInTwo(m.sets);
        if(dec && (m.sets[SETS-1][0]!==null||m.sets[SETS-1][1]!==null)) m.sets[SETS-1]=[null,null];
        [inputs[SETS-1], inputs[SETS-1+SETS]].forEach(x=>{ if(!x)return; if(dec){x.disabled=true;x.value="";} else if(!readOnly()){x.disabled=false;} });
      }
      // live warning for illegal scores (e.g. 22-21 must be a 2-point gap)
      if(grid.parentElement) markSetErrors(grid.parentElement, m);
    });
  });
  fitMatchNames();   // re-fit names to their boxes after live name/score updates
}
// Shrink the font as a name gets longer so it fits on one line (no wrapping).
function nameFontSize(text, base){ const L=(text||"").length;
  if(L>48) return base-5.5; if(L>40) return base-4.5; if(L>32) return base-3.5;
  if(L>26) return base-2.5; if(L>20) return base-1.5; if(L>16) return base-0.5; return base; }
function setNameKeepBadge(el, text){ if(el.textContent!==text){ el.textContent=text; el.style.fontSize=nameFontSize(text,13.5)+"px"; } }
// Grow the font as large as possible, then shrink only if the text actually overflows its box.
function fitText(el, maxPx, minPx){
  el.style.fontSize=maxPx+"px";
  let fs=maxPx, guard=0;
  while(fs>minPx && el.scrollWidth>el.clientWidth+1 && guard++<80){ fs-=0.5; el.style.fontSize=fs+"px"; }
}
// Make every group-match pair name as big as it can be without spilling out of its cell.
function fitMatchNames(){
  const els=document.querySelectorAll('#view .mgName');
  els.forEach(el=>fitText(el, 14.5, 8));
}

// Re-render the bracket in place WITHOUT losing the horizontal scroll position
// (otherwise entering a score jumps the wide bracket back to the far left).
function rerenderBracket(catKey){
  const holder=document.getElementById('bracketHolder'); if(!holder) return;
  const oldSc=holder.querySelector('.bracketCentered'); const sl=oldSc?oldSc.scrollLeft:0;
  const nb=renderBracket(catKey); holder.replaceWith(nb);
  const newSc=nb.querySelector('.bracketCentered'); if(newSc) newSc.scrollLeft=sl;
}
function refreshKnockoutNames(){
  const cat=DB[currentCat]; if(!cat.knockout) return;
  clearTimeout(window.__koTimer);
  window.__koTimer=setTimeout(()=>{
    // refresh first-round names from current standings (names/seeds only), then propagate + redraw bracket
    buildKnockout(currentCat,false);
    rerenderBracket(currentCat);
  },180);
}

function renderBracket(catKey){
  const ko=DB[catKey].knockout;
  const wrap=document.createElement('div'); wrap.id="bracketHolder";
  const nR=ko.rounds.length, lastIdx=nR-1;
  // ----- centered / mirrored layout: left half | Final | right half (mirrored) -----
  const makeCol=(ri,ties,tiOffset)=>{
    const col=document.createElement('div'); col.className="round";
    const hd=document.createElement('div'); hd.className="rhd"; hd.textContent=fullRoundName(ko.rnames[ri]); col.appendChild(hd);
    const body=document.createElement('div'); body.className="roundBody";
    ties.forEach((tie,i)=>{ const mw=document.createElement('div'); mw.className="matchWrap";
      mw.appendChild(renderTie(catKey,ri,tiOffset+i,tie,false)); body.appendChild(mw); });
    col.appendChild(body); return col;
  };
  const centered=document.createElement('div'); centered.className="bracketCentered";
  const left=document.createElement('div'); left.className="bHalf bLeft";
  const right=document.createElement('div'); right.className="bHalf bRight";
  for(let ri=0; ri<lastIdx; ri++){ const rd=ko.rounds[ri], h=Math.ceil(rd.length/2);
    left.appendChild(makeCol(ri, rd.slice(0,h), 0));
    right.appendChild(makeCol(ri, rd.slice(h), h)); }
  const finWrap=document.createElement('div'); finWrap.className="finalColWrap";
  const flbl=document.createElement('div'); flbl.className="rhd"; flbl.textContent=fullRoundName(ko.rnames[lastIdx]); finWrap.appendChild(flbl);
  const fcol=document.createElement('div'); fcol.className="finalCol";
  const fmw=document.createElement('div'); fmw.className="matchWrap"; fmw.appendChild(renderTie(catKey,lastIdx,0,ko.rounds[lastIdx][0],true));
  fcol.appendChild(fmw); finWrap.appendChild(fcol);
  const inner=document.createElement('div'); inner.className="bracketInner";
  inner.appendChild(left); inner.appendChild(finWrap); inner.appendChild(right);
  centered.appendChild(inner);
  wrap.appendChild(centered);
  if(false){
  const bw=document.createElement('div'); bw.className="bracketWrap";
  ko.rounds.forEach((round,ri)=>{
    const col=document.createElement('div'); col.className="round";
    const hd=document.createElement('div'); hd.className="rhd"; hd.textContent=fullRoundName(ko.rnames[ri]); col.appendChild(hd);
    const body=document.createElement('div'); body.className="roundBody";
    round.forEach((tie,ti)=>{
      const mw=document.createElement('div'); mw.className="matchWrap";
      mw.appendChild(renderTie(catKey,ri,ti,tie, ri===ko.rounds.length-1));
      body.appendChild(mw);
    });
    col.appendChild(body);
    bw.appendChild(col);
  });
  wrap.appendChild(bw);
  } // end disabled linear layout

  // champion + runner-up banner
  const finalRound=ko.rounds[ko.rounds.length-1];
  const champ  = finalRound.length===1 ? tieWinner(finalRound[0]) : null;
  const runner = finalRound.length===1 ? tieLoser(finalRound[0])  : null;
  const third  = ko.third ? tieWinner(ko.third) : null;
  const banner=document.createElement('div'); banner.className="champBanner"+(champ&&champ.name?" show":"");
  if(champ&&champ.name){
    banner.innerHTML=`🏆 Champion — ${escapeHtml(champ.name)}`
      + (runner&&runner.name ? `<span class="runnerUp">🥈 Runner-up — ${escapeHtml(runner.name)}</span>` : "")
      + (third&&third.name   ? `<span class="runnerUp bronze">🥉 3rd place — ${escapeHtml(third.name)}</span>` : "");
  }

  // 3rd/4th place playoff — its own box below the bracket, ABOVE the podium banner
  if(ko.third){
    const box=document.createElement('div'); box.className="thirdBox";
    const lbl=document.createElement('div'); lbl.className="rhd"; lbl.textContent="3rd / 4th place"; box.appendChild(lbl);
    const t=renderTie(catKey, ko.rounds.length-1, 99, ko.third, false);
    const bw3=tieWinner(ko.third);
    if(bw3&&bw3.name){ const br=document.createElement('div'); br.className="champ"; br.textContent="🥉 "+bw3.name; t.appendChild(br); }
    box.appendChild(t);
    wrap.appendChild(box);
  }

  wrap.appendChild(banner);   // podium banner last
  return wrap;
}

function renderTie(catKey,ri,ti,tie,isFinal){
  const el=document.createElement('div'); el.className="tie";
  const w=tieWinner(tie);
  // match details (only meaningful once both opponents are real)
  if(bothReal(tie)){
    const dh=detailsHeader(tie, "Match details"); dh.classList.add("koHdr"); el.appendChild(dh);
  }
  ["top","bot"].forEach(side=>{
    const p=tie[side];
    const slot=document.createElement('div'); slot.className="slot";
    const isBye=p&&p.bye;
    const isWin=w&&p&&!p.bye&&w.id===p.id&&w.name===p.name&&!isBye&&bothReal(tie);
    if(isBye) slot.classList.add('bye');
    if(isWin) slot.classList.add('win');
    if(ri===0 && !readOnly() && !isSeededDraw(catKey)){
      // editable: pick which qualifier (or BYE) fills this first-round slot (non-seeded draws only)
      const ko=DB[catKey].knockout, d=ko.draw[ti];
      const curRef = side==="top" ? (d?d.topRef:"") : (d?d.botRef:"");
      const sel=document.createElement('select'); sel.className="slotSel";
      sel.innerHTML=drawOptions(catKey, curRef);
      sel.onchange=()=>{
        const dd=DB[catKey].knockout.draw[ti];
        if(side==="top") dd.topRef=sel.value; else dd.botRef=sel.value;
        fillFirstRound(catKey); propagate(catKey); save(true);
        rerenderBracket(catKey);
      };
      slot.appendChild(sel);
    } else {
      const nm=document.createElement('div'); nm.className="nm";
      if(isBye){ nm.textContent="(overcome)"; }
      else if(!p){ nm.innerHTML=`<span style="color:var(--muted)">— awaiting —</span>`; }
      else { nm.innerHTML=`${p.ref?`<span class="seedtag">${p.ref}</span>`:""}${pairNameHTML(p.name||"?")}`; nm.style.fontSize=nameFontSize(p.name||"",12.5)+"px"; }
      slot.appendChild(nm);
    }
    // score inputs only if both sides are real (not bye/empty)
    if(bothReal(tie)){
      const sb=document.createElement('div'); sb.className="setBox";
      const kns=tie.sets.length;   // games in this tie (1 or best-of-3)
      for(let s=0;s<kns;s++){
        const idx = side==="top"?0:1;
        const inp=document.createElement('input'); inp.type="number"; inp.min="0"; inp.max="30";
        let val=tie.sets[s][idx];
        // 2-0 already? lock the (unused) deciding game — only for best-of-3
        if(kns>=3 && s===kns-1 && decidedInTwo(tie.sets)){ if(val!==null){tie.sets[s][idx]=null;val=null;} inp.disabled=true; }
        inp.value=(val===null||val===undefined)?"":val;
        const serr=setError(tie.sets[s][0], tie.sets[s][1]);
        if(serr){ inp.classList.add('err'); inp.title="Invalid set "+(s+1)+": "+serr; }
        // While typing: only update the data + save. Do NOT redraw (that would steal focus).
        inp.oninput=()=>{
          let x=inp.value===""?null:parseInt(inp.value,10);
          if(x!==null && !isNaN(x)){ if(x>30){x=30;inp.value=30;} if(x<0){x=0;inp.value=0;} }  // badminton game caps at 30
          tie.sets[s][idx]=(x===null||isNaN(x))?null:x;
          save(true);
        };
        // On leaving the field (blur / Enter): auto-fill 21 for the winner (if loser <=19),
        // then propagate winners and redraw the bracket.
        inp.onchange=()=>{
          const self=tie.sets[s][idx], oppIdx=idx===0?1:0, opp=tie.sets[s][oppIdx];
          if(self!==null && self!=="" && self>=0 && self<=19 && (opp===null||opp===undefined||opp==="")){
            tie.sets[s][oppIdx]=21; save(true);
          }
          propagate(catKey);
          rerenderBracket(catKey);
        };
        sb.appendChild(inp);
      }
      slot.appendChild(sb);
    }
    el.appendChild(slot);
  });
  // NOTE: no in-box "Final"/champion slot here — it made the final box taller than the
  // semifinal boxes, so the SF→Final connector attached lower and overlapped the box.
  // The column header already reads "FINAL" and the champion is shown in the banner below.
  return el;
}
function bothReal(tie){ return tie.top&&tie.bot&&!tie.top.bye&&!tie.bot.bye&&tie.top.name!==undefined&&tie.bot.name!==undefined; }

function fullRoundName(x){return {R16:"Round of 16",QF:"Quarterfinal",SF:"Semifinal",F:"Final"}[x]||x;}

/* ===================== UTIL / IO ===================== */
function escapeHtml(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function exportJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download="badminton_tournament_"+new Date().toISOString().slice(0,10)+".json"; a.click();
  flash("Exported");
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); DB=d; for(const k in CATS){if(!DB[k])DB[k]=freshCat(k);} save(); render(); flash("Imported"); }catch(e){alert("Invalid file");} };
  rd.readAsText(f); ev.target.value="";
}
function resetCat(){
  if(!confirm(`Reset ${CATS[currentCat].name}? This clears all pairs & scores for this category.`)) return;
  DB[currentCat]=freshCat(currentCat); save(); render();
}

// Re-order every group's matches for rest between games (keeps all scores, names & courts).
function reArrangeMatches(){
  DB[currentCat].groups.forEach(g=>rebuildMatches(g));
  save(); render();
  flash("Matches re-arranged");
}

// Auto-fill the "Match name / #" field sequentially, top to bottom:
// all group matches in group order (A, B, C ...), then knockout ties round by round.

/* ===================== BOOT ===================== */
if(readOnly()) document.body.classList.add('vo');
if(!VIEW_ONLY && !unlocked) document.body.classList.add('locked');   // scoring page, needs password
load();
render();
initCloud();
if(!VIEW_ONLY && !unlocked) promptUnlock();   // ask for the scoring password on load
</script>
